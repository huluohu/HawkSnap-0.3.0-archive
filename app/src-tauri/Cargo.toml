[package]
name = "hawksnap"
version = "0.3.0"
description = "HawkSnap — 像鹰一样准，一按就截"
authors = ["guxiaolong"]
edition.workspace = true
# Tauri CLI 的主二进制解析：包内存在多个 bin 目标时（主程序 + 探针），CLI 按
# default-run 定位「主程序」——缺失即报 "failed to find main binary" 且**在 cargo
# 运行前**中止（tauri build / tauri dev / CI size+release 三平台全断）。
# 显式指定 → 确定性恢复（M3 N4 评审修复）。
default-run = "hawksnap"
# bin 目标全部显式声明（src/main.rs 主程序 + 探针）——避免 src/bin/ 下的探针被
# 自动发现成第二个「主程序候选」，也便于给探针挂 required-features。
autobins = false

[lints]
workspace = true

# 探针等开发期工具的 feature 门（不进生产构建）：`probe-util` 开启后才编译
# keycast-focus-probe 探针 bin（及其 #[ignore] 集成测试）。
[features]
probe-util = []
# M4 P1：Native Messaging 宿主二进制（Chrome 拉起的独立小进程）。
# feature 门控：**不进默认构建**——M3 N4 教训：包内出现第二个「默认 bin 候选」会让
# `tauri build` / `tauri dev` 找错主程序（default-run 已定 hawksnap，但为免歧义
# 仍把宿主挂在 required-features 下）。构建：
#   cargo build --release --features native-host --bin hawksnap-host
native-host = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hawksnap-core.workspace = true
hawksnap-ocr.workspace = true
hawksnap-platform-mac.workspace = true
# 历史存储（C3）：SQLite + bundled amalgamation
rusqlite.workspace = true
# protocol-asset：tauri.conf.json 启用 assetProtocol 的硬性要求（build script 校验）
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
# 开机自启（C7）：仅写本地登录项（LaunchAgent），无外联。
tauri-plugin-autostart = "2"
# 自动更新（D3）：官方 updater 插件，内置 Ed25519（minisign）签名校验。更新检查是
# spec §5 唯一新增外联，经 settings.update_enabled 可关闭。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
chrono = "0.4"
# N2 GIF 导出（Task N2）：gifski 库（pngquant 系 GIF 编码器）。default-features=false
# 关掉 binary（clap/y4m/pbr/wild 等 CLI 依赖）与 png 输入——本 crate 只用
# add_frame_rgba（内存 RGBA 帧直喂），依赖树全 Rust 无 C 编译。GIF 循环/质量在
# app/src-tauri/src/gif.rs 的编码裁定（repeat=Infinite，quality 常量）。许可是
# AGPL-3.0-or-later（plan Tech Stack 预授权选型；主程序无 license 字段，分发口径
# 由仓库 LICENSE 统一，见任务报告）。
gifski = { version = "1.34", default-features = false }
# 编辑器降级装载（editor_image_dataurl）：asset 协议失败时 base64 dataURL 兜底。
# 0.22 已在依赖树（dev-dependencies 同版本），非新增下载。
base64 = "0.22"

# G7 伪签名集成测试：tiny_http 起本地静态源充当更新通道；tauri "test" feature 提供无
# 窗口的 mock app（updater_builder 需要插件状态挂在一个 App 上）。feature 仅测试构建
# 生效（dev-dependencies 不参与常规 build），不污染发布产物。
[dev-dependencies]
tiny_http = "0.12"
tauri = { version = "2", features = ["test"] }
# G7 fixture 自洽性对照（未篡改字节验签通过）：直接复用插件的验签原语与编码。
minisign-verify = "0.3"
base64 = "0.22"

# 媒体键 F1 兼容（Task 13）：NSEvent 全局监听 systemDefined（亮度下键）事件。
# 0.3.2 已在依赖树（wry）中，features 只增不改版本。
# N4 keycast 焦点实证探针（keycast-focus-probe）：NSWindow 绑定（canBecomeKeyWindow
# ——「能否成为 key window」的决定性判据）。同为 0.3.2，features 只增不改版本。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2", "NSWindow"] }
block2 = "0.6"
# Task 4 磁吸候选：CGWindowList 枚举在屏窗口。core-graphics 0.25 的 window 模块暴露
# copy_window_info + kCGWindow* 常量，core-foundation 供 CFArray/CFDictionary/CFNumber
# 迭代；两 crate 均已在依赖树（tauri/wry），大版本与 Cargo.lock 一致，不引入新解析。
core-graphics = "0.25"
core-foundation = "0.10"

# —— bin 目标（显式声明，autobins=false）——
# 主程序：tauri CLI 的主二进制（default-run 亦指向它）。
[[bin]]
name = "hawksnap"
path = "src/main.rs"

# N4 keycast 焦点实证探针（评审修复 Important 的证据载体）：macOS NSWindow 焦点
# 语义探针——仅在 `--features probe-util` 时编译，生产构建不含（且不参与主程序
# 解析：default-run 已定）。
[[bin]]
name = "keycast-focus-probe"
path = "src/bin/keycast-focus-probe.rs"
required-features = ["probe-util"]

# M4 P1：Native Messaging 宿主（Chrome 按 manifest 拉起 → stdio JSON 帧 →
# 转发给运行中的桌面端）。与探针同款门控：不进默认构建，不参与主程序解析。
[[bin]]
name = "hawksnap-host"
path = "src/bin/hawksnap-host.rs"
required-features = ["native-host"]
