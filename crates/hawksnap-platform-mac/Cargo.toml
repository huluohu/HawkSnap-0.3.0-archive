[package]
name = "hawksnap-platform-mac"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# 评审清单④：测试注入面（PipLane::inject_frame / set_state_for_probe / clear_injected
# + injected 槽）只在本 feature 或 crate 自身单测（cfg(test)）下编译——生产构建零
# 注入面。F9 探针与 real_pip_recording 集成测试需 --features test-util。
[features]
test-util = []

[dependencies]
hawksnap-core.workspace = true
xcap = "0.4"
image.workspace = true
# chrono 是**跨平台**纯 Rust 依赖（非 macOS 专属）：record.rs 的输出路径工具
# `recording_output_path` 的签名用到 DateTime<Local>，该函数跨平台保留（其余
# 平台照常可用），故 chrono 不能进 macOS 专属段（否则非 macOS 下签名无法解析）。
# 与 app 层同版，不引入新版本解析。
chrono = "0.4"

# Task 5 AX 悬停探测：AX 裸 extern 需要的 CF 类型托管（core-foundation）与
# CGPoint/CGSize 几何类型（core-graphics）。两 crate 均已在依赖树（app Task 4、xcap），
# 版本一致，不引入新版本解析。
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

# C5 贴图：原生 NSWindow + NSImageView 窗口族（无 webview，G2 预算）。objc2 0.6 /
# objc2-app-kit 0.3 / objc2-foundation 0.3 / objc2-core-graphics 0.3 均已在依赖树
# （wry/tauri），features 只增不改版本。app-kit features：窗口族（NSWindow/NSView/
# NSResponder/NSImageView/NSImage/NSCell[NSImageScaling]/NSGraphics[NSBackingStoreType]/
# NSScreen[主屏坐标翻转]/NSEvent[滚轮+按键]/NSApplication）+ objc2-core-graphics
# （NSImage 的 initWithCGImage 入口）；core-graphics 直连依赖补 CGDataProvider
# （app-kit 的传递 features 不含它，而 CGImage::new 需要 CGDataProvider）。
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray", "NSDictionary", "NSError", "NSValue", "NSString", "NSURL", "NSRunLoop",
] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGColor", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSCell", "NSColor", "NSEvent", "NSGraphics", "NSImage",
    "NSImageView", "NSResponder", "NSRunningApplication", "NSScreen",
    "NSView", "NSWindow", "objc2-core-graphics",
] }

# M6 录屏绑定栈（绑定可用性裁定见 src/record.rs 模块注 + 任务报告）：
# objc2-screen-capture-kit 0.3.2 与 objc2 0.6 生态同版（锁文件其余 objc2-* 均 0.3.2，
# 全部经 wry/tauri 已在依赖树，features 只增不改版本解析；screen-capture-kit 是唯一
# 新增 crate）。features 按用到的头文件取：SCShareableContent（含 SCDisplay/
# SCContentFilter/SCRunningApplication）+ SCStream（含 SCStreamConfiguration/Output/
# Delegate）+ SCError；libc 解锁 SCRunningApplication::processID（视频自排除按 PID
# 匹配本进程；libc 0.2 已在依赖树，不引入新版本解析）。
# AVFoundation 侧 AVAssetWriter/Input/PixelBufferAdaptor（MP4 mux + 内部 VT 硬编），
# AVMediaFormat（AVMediaTypeVideo/Audio）+ AVVideoSettings（AVVideoCodecH264）；
# block2：getShareableContent/finishWriting 的 completion handler 块。
# core-media（CMTime/CMSampleBuffer 新时间戳副本）与 core-video（CVPixelBuffer/
# 像素格式常量）均已在树，features 只增。dispatch2 0.3：SCStreamOutput 回调队列
# （screen-capture-kit 0.3.2 要求 >=0.3，wry 树内 0.2 为旧命名 Queue——0.3 更名
# DispatchQueue；双版本共存为 objc2 生态常规）。
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCShareableContent", "SCStream", "SCError", "libc",
] }
objc2-av-foundation = { version = "0.3", features = [
    "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2",
    "objc2-core-media", "objc2-core-video",
    # N3 相机画中画：AVCaptureSession/Device/DeviceInput/VideoDataOutput（委托协议
    # AVCaptureVideoDataOutputSampleBufferDelegate 挂在 AVCaptureOutputBase 下）。
    # features 只增，不改版本解析。
    "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutput", "AVCaptureOutputBase",
    "AVCaptureSession", "AVCaptureVideoDataOutput",
] }
objc2-core-media = { version = "0.3", features = [
    "CMBase", "CMTime", "CMSampleBuffer", "objc2-core-video",
] }
# N2 GIF 抽帧：CVPixelBufferLock/UnlockBaseAddress 需要 CVBase+CVBuffer+CVReturn
# features（GetWidth/GetHeight/GetBytesPerRow/GetBaseAddress 需要 CVBuffer）——
# features 只增，不改版本解析。
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVBase", "CVReturn"] }
block2 = "0.6"
dispatch2 = "0.3"
# M6：输出文件名时间戳（%Y-%m-%d-%H%M%S）+ soak 采样 CSV 行时间；与 app 层同版。
# chrono 已上移至 [dependencies]（跨平台纯 Rust，见上注）。
